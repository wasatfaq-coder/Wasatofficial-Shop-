name: CI

on:
  pull_request:
  push:
    branches: [main]

# Checks only read the code
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      # Product preview pages read the catalog as a visitor; without the database they are skipped with a warning
      - run: bun run build:share

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run test:rules

  functions:
    name: Cloud Functions tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: npm ci
        working-directory: functions
      - run: npm run typecheck
        working-directory: functions
      - run: npm run build
        working-directory: functions
      - run: bun run test:functions

  e2e:
    name: Browser scenarios (390 & 1280 px)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      # the runner's Chrome is used (playwright.config.ts), no browser download; data goes only to the emulators
      - run: bun run test:e2e
      - name: Screenshots and traces of failed scenarios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
