name: Deploy to Firebase

# Requires the repository secret FIREBASE_SERVICE_ACCOUNT (see README → «Деплой»).
# Cloud Functions are deployed only when the repository variable DEPLOY_FUNCTIONS is "true"
# (they need the Firebase Blaze plan).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FIREBASE_PROJECT: ai-studio-applet-webapp-e9574
  # Deploy steps are skipped (with a warning) until the secret is configured
  HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
  DEPLOY_FUNCTIONS: ${{ vars.DEPLOY_FUNCTIONS == 'true' }}

jobs:
  preview:
    name: Preview channel (PR)
    # Secrets are not available to PRs from forks
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The preview works with the store's real database: the build shows a banner saying so (PreviewBanner)
      - run: bun run build
        env:
          VITE_PREVIEW_BUILD: 'true'
      - if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — preview deploy skipped"
      # The site holds a limited number of preview channels, and every PR opens its own. Channels of closed and merged
      # PRs are removed first, so a new preview does not hit «channel quota reached». Channels of open PRs stay (the
      # owner checks several PRs at once): at most the 8 newest besides this one. The live site is not touched.
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Remove preview channels of closed PRs
        if: env.HAS_FIREBASE_SECRET == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          KEEP_OPEN: 8
        run: |
          open_prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number --jq '.[].number')
          bunx firebase hosting:channel:list --project "$FIREBASE_PROJECT" --json > channels.json
          jq -r '.result.channels[]?.name | split("/") | last' channels.json | grep '^pr[0-9]' > pr-channels.txt || true
          kept=0
          # Newest PR first: older open PRs lose their channel first when there are too many
          sort -t- -k1.3,1nr pr-channels.txt | while read -r channel; do
            number="${channel#pr}"; number="${number%%-*}"
            [ "$number" = "$CURRENT_PR" ] && continue
            if echo "$open_prs" | grep -qx "$number" && [ "$kept" -lt "$KEEP_OPEN" ]; then
              kept=$((kept + 1)); echo "Keeping preview channel $channel (PR #$number is open)"; continue
            fi
            echo "Removing preview channel $channel"
            bunx firebase hosting:channel:delete "$channel" --project "$FIREBASE_PROJECT" --force || true
          done
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT }}
          expires: 3d

  production:
    name: Hosting + Firestore rules (main)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.FIREBASE_PROJECT }}.web.app
    concurrency:
      group: firebase-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      # Never publish rules that fail their tests
      - run: bun run test:rules
      - run: bun run build
      - name: Install and test Cloud Functions
        if: env.DEPLOY_FUNCTIONS == 'true'
        run: |
          npm ci --prefix functions
          npm run typecheck --prefix functions
          bun run test:functions
      - if: env.HAS_FIREBASE_SECRET != 'true'
        run: echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is not set — deploy skipped"
      - if: env.HAS_FIREBASE_SECRET == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: env.HAS_FIREBASE_SECRET == 'true'
        run: |
          targets="hosting,firestore"
          if [ "$DEPLOY_FUNCTIONS" = "true" ]; then targets="$targets,functions"; fi
          bunx firebase deploy --only "$targets" --project "$FIREBASE_PROJECT" --non-interactive
